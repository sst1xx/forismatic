services:
  app:
    image: vitalplay/forismatic:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      DB_PATH: /data/quotes.db
    restart: unless-stopped
    init: true
    mem_limit: 256m
    cpus: "1.0"
    healthcheck:
      test: curl -so /dev/null -I http://localhost:8000 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
